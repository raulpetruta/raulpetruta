name: Contribution Snake

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#D97757&color_dots=#ebedf0,#f5d5c8,#eeb39e,#e39474,#D97757
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#D97757&color_dots=#161b22,#4a2a1f,#7a3f2c,#b35a3d,#D97757

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
